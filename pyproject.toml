[project]
name = "mortcal"
version = "0.1.0"
description = "Probabilistic mortality forecasting under distribution shift - calibration audit on HMD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
