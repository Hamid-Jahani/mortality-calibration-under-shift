[project]
name = "mortcal"
version = "0.1.0"
description = "Probabilistic mortality forecasting under distribution shift - calibration audit on HMD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov"]
# neural families only; kept out of the default env so classical work never
# waits on the 2.5 GB CUDA wheel. Install: uv sync --group neural
neural = ["torch>=2.6", "gpytorch>=1.13"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
